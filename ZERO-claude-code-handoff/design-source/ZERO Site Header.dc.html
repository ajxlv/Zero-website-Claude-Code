<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;background:var(--bg,#F6FAF1);border-bottom:1px solid var(--line,#D3E6C1)">
  <div style="max-width:1280px;margin:0 auto;height:80px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="ZERO%20Site%20Home.dc.html" aria-label="ZERO home" style="display:flex"><img src="assets/zero-logo.png" alt="ZERO" style="height:44px;width:auto;display:block"></a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:4px;font-size:15px;font-weight:500;white-space:nowrap;background:var(--surface,#FFFFFF);border:1px solid var(--line,#D3E6C1);border-radius:999px;padding:6px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="padding:8px 16px;border-radius:999px;color:var(--ink,#1F3A14);background:{{ n.bg }}" style-hover="background:var(--sage,#E8F5DC);color:var(--ink,#1F3A14)">{{ n.t }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="ZERO%20Site%20Contact.dc.html" style="height:48px;padding:0 24px;border-radius:999px;background:var(--terra,#3D7A22);color:#FFFFFF;font:600 15px 'Figtree',sans-serif;white-space:nowrap;display:flex;align-items:center" style-hover="background:var(--terrah,#2F6119);color:#FFFFFF">Book a demo</a>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggle }}" aria-label="Menu" style="width:48px;height:48px;border-radius:50%;background:var(--surface,#FFFFFF);border:1px solid var(--line,#D3E6C1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer"><span style="width:18px;height:1.8px;background:var(--ink,#1F3A14)"></span><span style="width:18px;height:1.8px;background:var(--ink,#1F3A14)"></span></button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid var(--line,#D3E6C1);padding:16px 32px 24px;display:flex;flex-direction:column;gap:4px;background:var(--bg,#F6FAF1)">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="padding:14px 16px;border-radius:16px;font-size:18px;font-weight:600;color:var(--deep,#1F3A14);background:{{ n.bg }}">{{ n.t }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Platform&quot;,&quot;Services&quot;,&quot;Pricing&quot;,&quot;Free tools&quot;,&quot;About&quot;,&quot;Blog&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state={w:typeof window!=='undefined'?window.innerWidth:1280,open:false};
  componentDidMount(){this.r=()=>this.setState({w:window.innerWidth});window.addEventListener('resize',this.r);}
  componentWillUnmount(){window.removeEventListener('resize',this.r);}
  renderVals(){
    const a=this.props.active??'',wide=this.state.w>=1080;
    const items=[['Platform','Platform'],['Services','Services'],['Pricing','Pricing'],['Free tools','Free%20Tools'],['About','About'],['Blog','Blog']];
    return {wide,narrow:!wide,menuOpen:!wide&&this.state.open,toggle:()=>this.setState(s=>({open:!s.open})),
      nav:items.map(([t,f])=>({t,href:'ZERO%20Site%20'+f+'.dc.html',bg:a===t?'var(--sage,#E8F5DC)':'transparent'}))};
  }
}
</script>
</body>
</html>
